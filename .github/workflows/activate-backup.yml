name: Activate backup
run-name: "Activate backup · ${{ github.actor }}"

# Failover manual: dispara el deploy del frontend backup (cuenta Render
# personal) y espera hasta que /api/warmup responda 200. Se corre desde
# Actions -> Activate backup -> Run workflow cuando el primary está caído.
#
# Requiere:
#   - secret RENDER_DEPLOY_HOOK_URL_BACKUP   (deploy hook del servicio backup)
#   - var    BACKUP_FRONTEND_URL             (URL publica, ej https://xxx.onrender.com)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    name: Trigger backup deploy and wait for health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger backup deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKUP }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL_BACKUP no está seteado"
            exit 1
          fi
          curl --fail -sS -X POST "$HOOK"

      - name: Wait for /api/warmup on backup
        env:
          URL: ${{ vars.BACKUP_FRONTEND_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "vars.BACKUP_FRONTEND_URL no está seteado"
            exit 1
          fi
          # /api/warmup devuelve 200 aunque el backend sea inalcanzable
          # (con warmed:false). Un 200 solo prueba que el Next.js del backup
          # respondio, no que el stack backend+frontend este sano. Parseamos
          # el body y exigimos warmed==true para dar el failover por listo.
          for i in $(seq 1 36); do
            body=$(curl -sS --max-time 20 "$URL/api/warmup" 2>/dev/null || echo "")
            warmed=$(printf '%s' "$body" | jq -r '.warmed // false' 2>/dev/null || echo "false")
            echo "attempt $i: warmed=$warmed body=$body"
            if [ "$warmed" = "true" ]; then
              echo "Failover backup operativo: frontend respondio y el backend es alcanzable"
              exit 0
            fi
            sleep 10
          done
          echo "Frontend backup no reporto warmed:true en 6 minutos"
          echo "Ultimo body recibido: $body"
          exit 1
