name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate-pr:
    name: Validate PR metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check title is not empty
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$(echo "$TITLE" | tr -d '[:space:]')" ]; then
            echo "::error::El título del PR no puede estar vacío."
            exit 1
          fi
          echo "✓ Título: $TITLE"

      - name: Check description is not empty
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          content=$(printf '%s' "$BODY" | sed '/<!--/,/-->/d' | grep -v '^[[:space:]]*$' | grep -v '^#' || true)
          if [ -z "$content" ]; then
            echo "::error::La descripción del PR no puede estar vacía."
            exit 1
          fi
          echo "✓ Descripción presente"

  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  notify-failure:
    name: Notify CI failure
    runs-on: ubuntu-latest
    needs: [validate-pr, lint-and-build]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI falló — Frontend ${{ github.ref_name }} (${{ github.actor }})"
          to: ${{ secrets.MAIL_TO }}
          from: CityPass+ CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            El pipeline de CI del Frontend falló en ${{ github.repository }}.

            Branch:   ${{ github.ref_name }}
            Commit:   ${{ github.sha }}
            Actor:    ${{ github.actor }}

            Ver detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
