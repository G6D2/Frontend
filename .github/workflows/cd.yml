name: CD
# El branch/sha ahora vienen del workflow_run que dispara este CD, no del ref actual.
run-name: "CD · deploy ${{ github.event.workflow_run.head_branch }} · ${{ github.event.workflow_run.head_sha }}"

on:
  # CD depende de CI: solo se dispara al terminar un run de CI sobre main.
  # El deploy real ademas exige que CI haya salido 'success' (ver el if del job).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Guardas duras:
    #  - conclusion == 'success': CI paso (lint + build + unit + integracion).
    #  - event == 'push':        descartamos runs de PR-CI que igual completaron.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Deploy to Render
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail -sS -X POST "$RENDER_DEPLOY_HOOK_URL"

      # Verificacion end-to-end: el POST al deploy hook solo *encola* el deploy en Render.
      # Sin este poll, un webhook aceptado deja el workflow en verde aunque despues
      # falle el build/deploy. Esperamos a que la ruta de warmup responda 2xx
      # con el servicio nuevo levantado. Render free puede tardar 3-8 min entre
      # build y cold start; damos hasta 10 min con reintentos de 15s.
      - name: Verify deploy health
        env:
          HEALTH_URL: https://frontend-krds.onrender.com/api/warmup
        run: |
          echo "Esperando 60s a que Render arranque el deploy..."
          sleep 60
          for i in $(seq 1 40); do
            if curl --fail -sS -o /dev/null "$HEALTH_URL"; then
              echo "✓ Health OK en intento $i ($HEALTH_URL)"
              exit 0
            fi
            echo "Intento $i/40: sin respuesta 2xx todavia, reintento en 15s..."
            sleep 15
          done
          echo "::error::El deploy no quedo saludable tras 10 min. Revisar Render logs."
          exit 1

  notify-failure:
    name: Notify deploy failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'failure'
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Deploy falló — Frontend ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: CityPass+ CD <${{ secrets.MAIL_USERNAME }}>
          body: |
            El pipeline de deploy del Frontend falló en ${{ github.repository }}.

            Branch:   ${{ github.event.workflow_run.head_branch }}
            Commit:   ${{ github.event.workflow_run.head_sha }}
            Actor:    ${{ github.event.workflow_run.actor.login }}

            Ver detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
